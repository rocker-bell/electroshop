<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Login & Registration | Electro Shop</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/main.css" />

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--slate-950) 0%, var(--slate-900) 50%, #1e1b4b 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 460px;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-tabs {
      display: flex;
      background: var(--slate-100);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 24px;
    }

    .auth-tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.875rem;
      color: var(--slate-600);
      cursor: pointer;
      transition: var(--transition);
    }

    .auth-tab-btn.active {
      background: var(--white);
      color: var(--slate-900);
      box-shadow: var(--shadow-sm);
    }

    .form-group label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--slate-700);
      margin-bottom: 6px;
    }

    .auth-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--slate-300);
      border-radius: var(--radius-md);
      font-size: 0.9375rem;
      outline: none;
      transition: var(--transition);
    }

    .auth-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .auth-submit-btn {
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: var(--radius-md);
      padding: 12px;
      width: 100%;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 10px;
    }

    .auth-submit-btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .auth-footer-nav {
      margin-top: 20px;
      text-align: center;
    }

    .auth-footer-nav a {
      color: var(--slate-400);
      font-size: 0.875rem;
      margin: 0 8px;
    }

    .auth-footer-nav a:hover {
      color: var(--white);
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-brand">
      <a href="../index.html" class="brand-logo justify-content-center">
        <div class="logo-icon"><i class="fas fa-bolt"></i></div>
        <span>ELECTRO</span>SHOP
      </a>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Sign In</button>
        <button type="button" class="auth-tab-btn" id="tabRegisterBtn" onclick="switchAuthTab('register')">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="form-group">
          <label for="email-login">Email Address</label>
          <input type="email" id="email-login" class="auth-input" placeholder="admin@electroshop.com" required />
        </div>
        <div class="form-group">
          <div class="d-flex justify-content-between">
            <label for="login-password">Password</label>
            <a href="javascript:void(0)" class="small text-muted" onclick="alert('Password reset link sent.');">Forgot?</a>
          </div>
          <input type="password" id="login-password" class="auth-input" placeholder="••••••••" required />
        </div>
        <button type="submit" class="auth-submit-btn">
          <i class="fas fa-sign-in-alt mr-1"></i> Sign In
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display: none;">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="auth-input" placeholder="Your username" required />
        </div>
        <div class="form-group">
          <label for="email-register">Email Address</label>
          <input type="email" id="email-register" class="auth-input" placeholder="yourname@domain.com" required />
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" class="auth-input" placeholder="Minimum 6 characters" required />
        </div>
        <button type="submit" class="auth-submit-btn">
          <i class="fas fa-user-plus mr-1"></i> Register Account
        </button>
      </form>
    </div>

    <div class="auth-footer-nav">
      <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Store</a>
      <span>•</span>
      <a href="../search.html">Explore Catalog</a>
      <span>•</span>
      <a href="Dashboard.html">Admin Portal</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/store.js"></script>
  <script>
    function switchAuthTab(mode) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLogin = document.getElementById('tabLoginBtn');
      const tabRegister = document.getElementById('tabRegisterBtn');

      if (mode === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabLogin.classList.remove('active');
        tabRegister.classList.add('active');
      }
    }

    // Login Submission (Connected to Backend Port 3000)
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email-login').value.trim();
      const password = document.getElementById('login-password').value.trim();

      const result = await ElectroAPI.login(email, password);
      if (result.success) {
        Store.showToast('Login successful! Redirecting to Dashboard...', 'success');
        setTimeout(() => {
          window.location.href = 'Dashboard.html';
        }, 1000);
      } else {
        Store.showToast(result.message || 'Invalid credentials', 'error');
      }
    });

    // Register Submission (Connected to Backend Port 3000)
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email-register').value.trim();
      const password = document.getElementById('register-password').value.trim();

      const result = await ElectroAPI.register(username, email, password);
      if (result.success) {
        Store.showToast('Account registered successfully! Please sign in.', 'success');
        switchAuthTab('login');
      } else {
        Store.showToast(result.message || 'Registration failed', 'error');
      }
    });
  </script>
</body>
</html>
