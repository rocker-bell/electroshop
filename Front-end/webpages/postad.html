<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post New Product Ad | Electro Shop</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/main.css" />

  <style>
    body {
      background-color: var(--slate-100);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .post-container {
      max-width: 680px;
      margin: 40px auto;
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--slate-200);
    }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="container">
      <div class="nav-container">
        <a href="../index.html" class="brand-logo">
          <div class="logo-icon"><i class="fas fa-bolt"></i></div>
          <span>ELECTRO</span>SHOP
        </a>
        <div class="nav-actions">
          <a href="../search.html" class="btn btn-outline-light btn-sm mr-2">Explore Catalog</a>
          <a href="Dashboard.html" class="btn btn-danger btn-sm font-weight-bold">Admin Dashboard</a>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="post-container">
      <h2 class="font-weight-bold mb-2">Create Product Advertisement</h2>
      <p class="text-muted small mb-4">Add a new electronic listing to the Electro Shop catalog and database.</p>

      <form id="postAdForm">
        <div class="form-group">
          <label class="font-weight-bold small">Category</label>
          <select id="adCategory" class="form-control" required>
            <option value="Laptops & Computers">Laptops & Computers</option>
            <option value="Smartphones & Tablets">Smartphones & Tablets</option>
            <option value="Audio & Headphones">Audio & Headphones</option>
            <option value="Gaming & Esports">Gaming & Esports</option>
            <option value="Smart Wearables">Smart Wearables</option>
            <option value="Cameras & Drones">Cameras & Drones</option>
            <option value="Accessories & Power">Accessories & Power</option>
          </select>
        </div>

        <div class="form-group">
          <label class="font-weight-bold small">Product Title / Model Name</label>
          <input type="text" id="adName" class="form-control" placeholder="e.g. MacBook Pro 16 M3 Max" required />
        </div>

        <div class="form-row">
          <div class="form-group col-md-6">
            <label class="font-weight-bold small">Price ($)</label>
            <input type="number" step="0.01" id="adPrice" class="form-control" placeholder="1299.00" required />
          </div>
          <div class="form-group col-md-6">
            <label class="font-weight-bold small">Brand</label>
            <input type="text" id="adBrand" class="form-control" placeholder="e.g. Apple, Sony, Asus" required />
          </div>
        </div>

        <div class="form-group">
          <label class="font-weight-bold small">Detailed Product Description & Specifications</label>
          <textarea id="adDescription" class="form-control" rows="4" placeholder="Mention key technical features, battery life, screen resolution..." required></textarea>
        </div>

        <button type="submit" class="btn btn-danger btn-block font-weight-bold py-3 mt-4" style="border-radius: var(--radius-md);">
          <i class="fas fa-paper-plane mr-2"></i> Publish Advertisement
        </button>
      </form>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/store.js"></script>
  <script>
    document.getElementById('postAdForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const category = document.getElementById('adCategory').value;
      const name = document.getElementById('adName').value.trim();
      const price = parseFloat(document.getElementById('adPrice').value) || 0;
      const description = document.getElementById('adDescription').value.trim();

      await ElectroAPI.addProduct({ category, name, price, description });
      Store.showToast(`Ad for "<strong>${name}</strong>" created successfully!`, 'success');
      setTimeout(() => {
        window.location.href = '../search.html';
      }, 1200);
    });
  </script>
</body>
</html>
